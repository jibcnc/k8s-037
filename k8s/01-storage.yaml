apiVersion: v1
kind: PersistentVolume
metadata:
  name: research-pv-037
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/k8s-037/research
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-pvc-037
  namespace: id-037
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: research-pv-037
  resources:
    requests:
      storage: 50Mi
