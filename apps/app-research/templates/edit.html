<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Edit Research — ID-037</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1f2937; margin: 0; padding: 40px; color: #f9fafb; }
    .wrap { max-width: 900px; margin: auto; }
    textarea { width: 100%; height: 420px; font-size: 16px; line-height: 1.6; padding: 12px; box-sizing: border-box; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 28px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    .ok { background: #065f46; padding: 10px 14px; border-radius: 8px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Portal — แก้ไขสรุปงานวิจัย</h1>
    {% if saved %}<p class="ok">✔ บันทึกเรียบร้อย (เก็บไว้ใน Persistent Volume)</p>{% endif %}
    <form method="post" action="/edit">
      <textarea name="text">{{ text }}</textarea>
      <button type="submit">Save</button>
    </form>
    <p>ดูผลลัพธ์ได้ที่ <a href="http://www.id-037.com/research">www.id-037.com/research</a></p>
  </div>
</body>
</html>
